[package]
name = "vmpod"
version = "1.1.0"
edition = "2021"
authors = ["vmpod contributors"]
description = "Fast, local-first CLI to spin up and orchestrate hardware-accelerated Linux VMs inside Docker using QEMU/KVM"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
clap = { version = "=4.6.7", features = ["derive"] }
bollard = "=0.21.1"
anyhow = "=1.0.104"
futures-util = "0.3"
